name: Daily Work Log Reminder

on:
  schedule:
    # 注意：GitHub Actions 使用 UTC 时间。北京时间 21:00 等于 UTC 时间 13:00
    - cron: '0 13 * * 1-5' # 周一到周五的晚上 9 点执行 (可根据周末是否需要调整)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install supabase requests
      - name: Run reminder script
        run: python daily_reminder.py
