name: Daily Work Log Reminder

on:
  schedule:
    # 每天北京时间 21:05, 22:05, 23:05 和次日 00:05 各执行一次
    - cron: '5 13,14,15,16 * * *'
  # 👇 就是这下面这一行控制着“手动运行”按钮，缩进必须和 schedule 对齐 👇
  workflow_dispatch: 

jobs:
  run-reminder:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pytz supabase

    - name: Run daily reminder script
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
      run: python daily_reminder.py
