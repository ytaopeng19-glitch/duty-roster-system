name: 晚间日志催收自动化

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  run-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码仓库
        uses: actions/checkout@v4  # 👈 升级到 v4 解决警告

      - name: 设置 Python 环境
        uses: actions/setup-python@v5 # 👈 升级到 v5 解决警告
        with:
          python-version: '3.9'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: 运行企业微信提醒脚本
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python daily_reminder.py
