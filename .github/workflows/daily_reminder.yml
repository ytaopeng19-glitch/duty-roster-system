name: Daily Work Log Reminder

on:
  schedule:
    # 每天北京时间 21:05, 22:05, 23:05 和次日 00:05 各执行一次（错峰 5 分钟避免拥堵）
    - cron: '40 13,14,15,16 * * *'
  # 允许在 Actions 页面手动点击 Run workflow 触发
  workflow_dispatch: 

jobs:
  run-reminder:
    runs-on: ubuntu-latest

    steps:
    # 1. 获取仓库代码
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. 安装脚本需要的依赖包
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pytz supabase

    # 4. 运行提醒脚本并注入 Secrets 环境变量
    - name: Run daily reminder script
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
      run: python daily_reminder.py
