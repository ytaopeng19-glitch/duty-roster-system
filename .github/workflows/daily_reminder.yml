name: 晚间日志催收自动化

on:
  schedule:
    # 每天北京时间 21:00, 22:00, 23:00 和 24:00 (次日00:00) 各执行一次
    - cron: '10 13,14,15,16 * * *'
  # 保留手动触发按钮，方便您随时测试
  workflow_dispatch:

jobs:
  run-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码 (Checkout code)
        uses: actions/checkout@v4

      - name: 配置 Python 环境 (Set up Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 安装 Python 依赖包 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install pytz requests supabase

      - name: 运行企业微信提醒脚本
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python daily_reminder.py
