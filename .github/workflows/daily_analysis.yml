name: Daily Lab Log Analysis

on:
  schedule:
    # 定时任务：UTC 时间 00:00 执行（对应北京时间早上 08:00）
    - cron: '0 0 * * *'
  # 允许在 GitHub Actions 页面手动点击 "Run workflow" 运行测试
  workflow_dispatch:

jobs:
  analyze-logs:
    runs-on: ubuntu-latest

    steps:
      # 1. 获取代码仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖（已更新为最新的 google-genai 包）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz supabase python-docx google-genai --upgrade

      # 4. 执行分析脚本（已映射全部所需的 Secrets 为环境变量）
      - name: Run Gemini Analysis Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_analysis.py
