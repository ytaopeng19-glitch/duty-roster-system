name: Daily AI Log Analysis

on:
  schedule:
    # 每天北京时间凌晨 00:30 执行一次（此时大家的日志大概率已经全部提交完毕）
    # UTC 时间 16:30 对应北京时间 00:30
    - cron: '30 16 * * *'
  workflow_dispatch: 

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 增加了 docx 和 gemini 的依赖库
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pytz supabase google-generativeai python-docx

    - name: Run Gemini Analysis Script
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python daily_analysis.py