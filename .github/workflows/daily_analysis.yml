name: Daily Log Analysis

on:
  schedule:
    # 核心修改：UTC 时间 23:15，对应北京时间次日早上 07:15
    - cron: '15 23 * * *'  
  workflow_dispatch: # 依然保留手动触发按钮，方便您随时测试

jobs:
  analyze_logs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz python-docx google-genai supabase

      - name: Run Analysis Script
        env:
          # 确保这里的 Secrets 名称与您在 GitHub Settings 中配置的一致
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_analysis.py
